  name:
    short: Visruth
    full: Visruth Srimath Kandali
  link:
    home: https://www.visruth.com
    github: https://github.com/VisruthSK
    bluesky: https://bsky.app/profile/visruth.com
    linkedin: https://www.linkedin.com/in/visruthsk

color:
  palette:
    cream: "#F6EFE1"
    blackish: "#0A0A0A"
    espresso: "#1E1512"
    shell: "#F2E8DE"

    oxblood: "#380C12"
    oxblood-light: "#DA5265"
    taupe: "#6B5B52"
    taupe-light: "#C9BAAE"
    blush: "#EAE0D8"
    sable: "#241813"
    teal: "#146860"
    teal-light: "#5FCBB8"
    ochre: "#A8721C"
    ochre-light: "#F0BC5C"
    carmine: "#A8283A"
    carmine-light: "#F0879A"

    code-bg-light: "#F0E6DC"
    code-bg-dark: "#1D1512"

  background:
    light: cream
    dark: blackish
  foreground:
    light: espresso
    dark: shell

  primary:
    light: oxblood
    dark: oxblood-light

  secondary:
    light: taupe
    dark: taupe-light
  tertiary:
    light: blush
    dark: sable

  success:
    light: teal
    dark: teal-light
  info:
    light: oxblood
    dark: oxblood-light
  warning:
    light: ochre
    dark: ochre-light
  danger:
    light: carmine
    dark: carmine-light

typography:
  fonts:
    - family: Domine
      source: google
    - family: DM Serif Display
      source: google
    - family: IBM Plex Mono
      source: google
  base: Domine
  headings: DM Serif Display
  monospace: IBM Plex Mono

  monospace-inline:
    background-color:
      light: code-bg-light
      dark: code-bg-dark
  monospace-block:
    background-color:
      light: code-bg-light
      dark: code-bg-dark
